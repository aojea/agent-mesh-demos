name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-mesh-demos
        uses: actions/checkout@v4
        with:
          path: agent-mesh-demos

      - name: Checkout sam
        uses: actions/checkout@v4
        with:
          repository: google/sam
          path: sam
          ref: v0.1.0-rc.7 # Pin to match demos

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle SDK
        run: |
          cd sam/sdk/js
          npm install
          npm run build
          npm run bundle:browser

      - name: Copy SDK bundle to public
        run: |
          mkdir -p agent-mesh-demos/public/sdk
          cp sam/sdk/js/build/browser/index.js agent-mesh-demos/public/sdk/
          cp sam/sdk/js/build/browser/biscuit_bg.wasm agent-mesh-demos/public/sdk/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: none

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'agent-mesh-demos/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
