name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-mesh-demos
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle SDK
        env:
          SAM_VERSION: v0.1.0-rc.7
        run: |
          npm install --no-audit --no-fund
          chmod +x ./scripts/setup-sam.sh
          ./scripts/setup-sam.sh
          mkdir -p public/sdk
          cp .sam-bin/sdk/index.js public/sdk/
          cp .sam-bin/sdk/biscuit_bg.wasm public/sdk/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
